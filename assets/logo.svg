<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffb380" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0a02"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  <rect width="200" height="200" rx="40" fill="none" stroke="#ff5500" stroke-width="1.5" opacity="0.35"/>

  <circle cx="100" cy="100" r="80" fill="url(#core)" opacity="0.6"/>

  <g transform="translate(100 100)">
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="24s" repeatCount="indefinite" additive="replace" />
    <g fill="#ff8a3d">
      <circle cx="0" cy="0" r="4"/>
      <circle cx="6" cy="-3" r="2.6" opacity="0.9"/>
      <circle cx="-5" cy="4" r="2.4" opacity="0.9"/>
      <circle cx="4" cy="5" r="1.8" opacity="0.75"/>
      <circle cx="-6" cy="-4" r="1.6" opacity="0.75"/>
    </g>
    <g fill="#ff5500" opacity="0.9">
      <circle cx="14" cy="0" r="2.4"/>
      <circle cx="19" cy="5" r="2"/>
      <circle cx="23" cy="11" r="1.7"/>
      <circle cx="25" cy="18" r="1.4"/>
      <circle cx="25" cy="26" r="1.1"/>
      <circle cx="-14" cy="0" r="2.4"/>
      <circle cx="-19" cy="-5" r="2"/>
      <circle cx="-23" cy="-11" r="1.7"/>
      <circle cx="-25" cy="-18" r="1.4"/>
      <circle cx="-25" cy="-26" r="1.1"/>
    </g>
  </g>

  <g transform="translate(100 100)">
    <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="38s" repeatCount="indefinite"/>
    <g fill="#ff5500" opacity="0.55">
      <circle cx="34" cy="22" r="1.8"/>
      <circle cx="40" cy="30" r="1.5"/>
      <circle cx="44" cy="39" r="1.3"/>
      <circle cx="46" cy="49" r="1"/>
      <circle cx="-34" cy="-22" r="1.8"/>
      <circle cx="-40" cy="-30" r="1.5"/>
      <circle cx="-44" cy="-39" r="1.3"/>
      <circle cx="-46" cy="-49" r="1"/>
      <circle cx="34" cy="-22" r="1.5"/>
      <circle cx="40" cy="-30" r="1.2"/>
      <circle cx="-34" cy="22" r="1.5"/>
      <circle cx="-40" cy="30" r="1.2"/>
    </g>
  </g>

  <g fill="#ffb380" opacity="0.35">
    <circle cx="30" cy="40" r="1">
      <animate attributeName="opacity" values="0.35;0.05;0.35" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="55" r="1.2">
      <animate attributeName="opacity" values="0.35;0.05;0.35" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45" cy="165" r="1">
      <animate attributeName="opacity" values="0.35;0.05;0.35" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="150" r="1.3">
      <animate attributeName="opacity" values="0.35;0.05;0.35" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="20" r="1">
      <animate attributeName="opacity" values="0.35;0.05;0.35" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>